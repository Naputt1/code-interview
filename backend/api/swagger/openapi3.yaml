openapi: 3.0.0
info:
  contact: {}
  description: Track orders through a configurable multi-step manufacturing
    process and monitor resource consumption.
  title: Manufacturing Process Tracker API
  version: 1.0.0
paths:
  /board:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/service.Board"
      summary: Orders currently in progress at each step
      tags:
        - views
  /consumptions:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/domain.Consumption"
                type: array
      summary: Recent entries from the consumption ledger
      tags:
        - views
  /health:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Liveness probe
      tags:
        - system
  /orders:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/domain.Order"
                type: array
      summary: List all orders with their steps
      tags:
        - orders
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/service.OrderInput"
        description: Order payload
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Order"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Create an order and snapshot the current process sequence into its steps
      tags:
        - orders
  "/orders/{id}":
    get:
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Order"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Get one order with steps and consumption
      tags:
        - orders
  "/orders/{id}/cancel":
    post:
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Order"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Cancel an order that has no running step
      tags:
        - orders
  "/orders/{id}/steps/{stepId}/complete":
    post:
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          schema:
            type: integer
        - description: Order step ID
          in: path
          name: stepId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Order"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Complete an order's running step
      tags:
        - orders
  "/orders/{id}/steps/{stepId}/start":
    post:
      parameters:
        - description: Order ID
          in: path
          name: id
          required: true
          schema:
            type: integer
        - description: Order step ID
          in: path
          name: stepId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Order"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Start an order's step (checks sequence, WIP limit and resource capacity)
      tags:
        - orders
  /overview:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/service.Overview"
      summary: Status of all orders, per-step load and resource consumption
      tags:
        - views
  /processes:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/domain.Process"
                type: array
      summary: List processes in sequence order
      tags:
        - processes
    post:
      requestBody:
        $ref: "#/components/requestBodies/service.ProcessInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Process"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Create a process (step) with its resource recipe
      tags:
        - processes
  "/processes/{id}":
    delete:
      parameters:
        - description: Process ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Delete a process
      tags:
        - processes
    get:
      parameters:
        - description: Process ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Process"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Get one process
      tags:
        - processes
    put:
      parameters:
        - description: Process ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/service.ProcessInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Process"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Update a process, its recipe and/or its place in the sequence
      tags:
        - processes
  /resources:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/domain.Resource"
                type: array
      summary: List all resources
      tags:
        - resources
    post:
      requestBody:
        $ref: "#/components/requestBodies/service.ResourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Resource"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Create a resource
      tags:
        - resources
  "/resources/{id}":
    delete:
      parameters:
        - description: Resource ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Delete a resource
      tags:
        - resources
    put:
      parameters:
        - description: Resource ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/service.ResourceInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/domain.Resource"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpapi.ErrorResponse"
      summary: Update a resource
      tags:
        - resources
servers:
  - url: /api
components:
  requestBodies:
    service.ResourceInput:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/service.ResourceInput"
      description: Resource payload
      required: true
    service.ProcessInput:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/service.ProcessInput"
      description: Process payload
      required: true
  schemas:
    domain.Consumption:
      properties:
        id:
          type: integer
        occurredAt:
          type: string
        orderStepId:
          type: integer
        quantity:
          type: number
        resourceId:
          type: integer
      type: object
    domain.Order:
      properties:
        createdAt:
          type: string
        id:
          type: integer
        quantity:
          type: integer
        reference:
          type: string
        status:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/domain.OrderStep"
          type: array
        updatedAt:
          type: string
      type: object
    domain.OrderStep:
      properties:
        consumptions:
          items:
            $ref: "#/components/schemas/domain.Consumption"
          type: array
        finishedAt:
          type: string
        id:
          type: integer
        orderId:
          type: integer
        position:
          type: integer
        process:
          $ref: "#/components/schemas/domain.Process"
        processId:
          type: integer
        startedAt:
          type: string
        status:
          type: string
      type: object
    domain.Process:
      properties:
        createdAt:
          type: string
        id:
          type: integer
        inputs:
          items:
            $ref: "#/components/schemas/domain.ProcessResource"
          type: array
        name:
          type: string
        position:
          type: integer
        updatedAt:
          type: string
        wipLimit:
          type: integer
      type: object
    domain.ProcessResource:
      properties:
        id:
          type: integer
        processId:
          type: integer
        quantity:
          type: number
        resource:
          $ref: "#/components/schemas/domain.Resource"
        resourceId:
          type: integer
      type: object
    domain.Resource:
      properties:
        capacity:
          type: number
        createdAt:
          type: string
        id:
          type: integer
        kind:
          type: string
        name:
          type: string
        unit:
          type: string
        updatedAt:
          type: string
      type: object
    httpapi.ErrorDetail:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    httpapi.ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/httpapi.ErrorDetail"
      type: object
    service.Board:
      properties:
        columns:
          items:
            $ref: "#/components/schemas/service.BoardColumn"
          type: array
      type: object
    service.BoardColumn:
      properties:
        process:
          $ref: "#/components/schemas/domain.Process"
        queued:
          items:
            $ref: "#/components/schemas/service.BoardStep"
          type: array
        running:
          items:
            $ref: "#/components/schemas/service.BoardStep"
          type: array
      type: object
    service.BoardStep:
      properties:
        orderId:
          type: integer
        quantity:
          type: integer
        reference:
          type: string
        startable:
          description: >-
            Startable is meaningful on queued steps: it is true only when every

            earlier step of the order is done and the process has a free WIP slot,

            so the board can offer a Start button that will really be accepted.
          type: boolean
        startedAt:
          type: string
        status:
          type: string
        stepId:
          type: integer
      type: object
    service.OrderCounts:
      properties:
        cancelled:
          type: integer
        done:
          type: integer
        inProgress:
          type: integer
        pending:
          type: integer
        total:
          type: integer
      type: object
    service.OrderInput:
      properties:
        quantity:
          type: integer
        reference:
          type: string
      required:
        - quantity
        - reference
      type: object
    service.Overview:
      properties:
        orders:
          $ref: "#/components/schemas/service.OrderCounts"
        processes:
          items:
            $ref: "#/components/schemas/service.ProcessLoad"
          type: array
        resources:
          items:
            $ref: "#/components/schemas/service.ResourceUsage"
          type: array
      type: object
    service.ProcessInput:
      properties:
        inputs:
          items:
            $ref: "#/components/schemas/service.ProcessResourceInput"
          type: array
        name:
          type: string
        position:
          type: integer
        wipLimit:
          type: integer
      required:
        - name
      type: object
    service.ProcessLoad:
      properties:
        done:
          type: integer
        name:
          type: string
        position:
          type: integer
        processId:
          type: integer
        queued:
          type: integer
        running:
          type: integer
      type: object
    service.ProcessResourceInput:
      properties:
        quantity:
          type: number
        resourceId:
          type: integer
      required:
        - quantity
        - resourceId
      type: object
    service.ResourceInput:
      properties:
        capacity:
          type: number
        kind:
          type: string
        name:
          type: string
        unit:
          type: string
      required:
        - kind
        - name
        - unit
      type: object
    service.ResourceUsage:
      properties:
        consumed:
          type: number
        remaining:
          type: number
        resource:
          $ref: "#/components/schemas/domain.Resource"
        usedBy:
          type: integer
      type: object
